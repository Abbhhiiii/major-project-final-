[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-surveillance-platform"
version = "0.1.0"
description = "Local-first agentic road-accident surveillance demo"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "certifi>=2025.1",
  "fastapi>=0.115,<1",
  "groq>=0.31,<1",
  "opencv-python>=4.13,<6",
  "pypdf>=6.0,<7",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0,<3",
  "twilio>=9.8,<10",
  "ultralytics>=8.4,<9",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "fpdf2>=2.8,<3",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/surveillance", "apps/backend"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
